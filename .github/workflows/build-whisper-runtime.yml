name: Build Whisper Runtime

on:
  pull_request:
    paths:
      - .github/workflows/build-whisper-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build whisper.cpp
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF
          cmake --build whisper.cpp/build --config Release --target whisper-cli -j 2

      - name: Download multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          bash whisper.cpp/models/download-ggml-model.sh tiny-q5_1
          mkdir -p artifact
          cp whisper.cpp/build/bin/whisper-cli artifact/
          cp whisper.cpp/models/ggml-tiny-q5_1.bin artifact/
          sha256sum artifact/* > artifact/SHA256SUMS

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux-x64-tiny-q5_1
          path: artifact
          compression-level: 0
          retention-days: 1
